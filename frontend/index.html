<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator Fleet Dashboard</title>
    <meta name="description" content="Real-time elevator fleet dispatch dashboard with GBFS, A*, and baseline strategy comparison">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- Top Bar: Live Stats -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <header id="stats-bar">
        <div class="stat-group">
            <div class="stat" id="stat-strategy">
                <span class="stat-label">Strategy</span>
                <span class="stat-value" id="val-strategy">GBFS</span>
            </div>
            <div class="stat" id="stat-scenario">
                <span class="stat-label">Scenario</span>
                <span class="stat-value" id="val-scenario">random</span>
            </div>
        </div>
        <div class="stat-group">
            <div class="stat">
                <span class="stat-label">Avg Wait</span>
                <span class="stat-value" id="val-avg-wait">0.0s</span>
            </div>
            <div class="stat">
                <span class="stat-label">Max Wait</span>
                <span class="stat-value" id="val-max-wait">0.0s</span>
            </div>
            <div class="stat highlight" id="stat-sla">
                <span class="stat-label">SLA</span>
                <span class="stat-value" id="val-sla">MET</span>
            </div>
        </div>
        <div class="stat-group">
            <div class="stat">
                <span class="stat-label">Served</span>
                <span class="stat-value" id="val-completed">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Calls</span>
                <span class="stat-value" id="val-calls">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Active</span>
                <span class="stat-value" id="val-active">0</span>
            </div>
        </div>
        <div class="stat-group">
            <div class="stat">
                <span class="stat-label">Step</span>
                <span class="stat-value" id="val-step">0/3600</span>
            </div>
            <div class="stat">
                <span class="stat-label">Time</span>
                <span class="stat-value" id="val-time">00:00:00</span>
            </div>
        </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- Main Layout -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <main id="dashboard">
        <!-- Left: Controls -->
        <aside id="controls-panel">
            <h2>Controls</h2>

            <div class="control-group">
                <label for="sel-strategy">Strategy</label>
                <select id="sel-strategy">
                    <option value="gbfs" selected>GBFS (Smart)</option>
                    <option value="nearest">Nearest Lift</option>
                    <option value="round_robin">Round Robin</option>
                    <option value="scan">SCAN</option>
                </select>
            </div>

            <div class="control-group">
                <label for="sel-scenario">Scenario</label>
                <select id="sel-scenario">
                    <option value="morning_rush">Morning Rush</option>
                    <option value="lunch_peak">Lunch Peak</option>
                    <option value="evening_rush">Evening Rush</option>
                    <option value="random_uniform" selected>Random Uniform</option>
                </select>
            </div>

            <div class="control-group">
                <label for="inp-seed">Seed</label>
                <input type="number" id="inp-seed" value="42" min="0" max="9999">
            </div>

            <div class="control-group">
                <label for="rng-speed">Speed: <span id="speed-label">1x</span></label>
                <input type="range" id="rng-speed" min="0.5" max="20" step="0.5" value="1">
            </div>

            <div class="btn-row">
                <button id="btn-start" class="btn btn-primary">▶ Start</button>
                <button id="btn-pause" class="btn btn-secondary">⏸ Pause</button>
            </div>
            <button id="btn-reset" class="btn btn-outline">↺ Reset</button>

            <hr>

            <div class="control-group">
                <label>
                    <input type="checkbox" id="chk-heatmap"> Floor Heatmap
                </label>
            </div>

            <!-- GBFS Weights Display -->
            <div id="weights-panel">
                <h3>GBFS Weights</h3>
                <div id="weights-bars"></div>
            </div>
        </aside>

        <!-- Center: Building Visualization -->
        <section id="building-view">
            <div id="building-container">
                <!-- Floors and elevators rendered by JS -->
            </div>
        </section>

        <!-- Right: Decision Log + Charts -->
        <aside id="right-panel">
            <div id="decision-log">
                <h2>Decision Log</h2>
                <div id="log-entries"></div>
            </div>

            <div id="charts-panel">
                <h2>Live Charts</h2>
                <div class="chart-container">
                    <h3>Avg Wait Time</h3>
                    <canvas id="chart-wait" width="320" height="140"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Elevator Utilization</h3>
                    <canvas id="chart-util" width="320" height="140"></canvas>
                </div>
            </div>
        </aside>
    </main>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- Progress Bar -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <footer id="progress-bar">
        <div id="progress-fill"></div>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
